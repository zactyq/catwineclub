# Production stack for catwineclub.tanisaac.com (Hostinger VPS).
#
#   web    - the Next.js app (built from ../web/Dockerfile)
#   nocodb - data + attachment storage (SQLite volume)
# TLS termination and public routing belong to /opt/shared/vps-gateway.
#
# Secrets live in ./web.env and ./nocodb.env (git-ignored), created from the
# .example files next to this one. Persistent state: nocodb_data volume and
# ./data/auth.db bind mount.
name: catwineclub

services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: https://catwine.club
    restart: unless-stopped
    env_file:
      - ./web.env
    volumes:
      - ./data/auth.db:/app/auth.db
    expose:
      - "3000"
    networks:
      backend:
      gateway:
        aliases:
          - catwineclub-main-web
    depends_on:
      - nocodb

  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    env_file:
      - ./nocodb.env
    volumes:
      - nocodb_data:/usr/app/data
    expose:
      - "8080"
    networks:
      backend:
      gateway:
        aliases:
          - catwineclub-nocodb

networks:
  backend:
    name: catwineclub-backend
    internal: true
  gateway:
    external: true
    name: catwineclub-gateway

volumes:
  # Pre-created and seeded from the previous deployment's data during migration.
  nocodb_data:
    external: true
    name: catwineclub_nocodb_data
