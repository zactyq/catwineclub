services:
  nocodb:
    image: nocodb/nocodb:latest
    container_name: cwc-nocodb
    ports:
      - "8081:8080"
    environment:
      NC_ADMIN_EMAIL: ${NOCODB_ADMIN_EMAIL:-admin@catwineclub.local}
      NC_ADMIN_PASSWORD: ${NOCODB_ADMIN_PASSWORD:-changeme123!}
    volumes:
      - nocodb_data:/usr/app/data

volumes:
  nocodb_data:
